application: btc-now
version: 1
runtime: python
api_version: 1

handlers:

- url: /btcadmin
  script: btcadmin.py
  login: admin

- url: /about
  static_files: static/about.html
  upload: static/about.html

- url: /rules
  static_files: static/rules.html
  upload: static/rules.html

- url: /favicon\.ico
  static_files: static/images/favicon.ico
  upload: static/images/favicon.ico

- url: /dw
  script: dw_buy.py

- url: /ok
  script: ok_buy.py

- url: /dw_callback
  script: dw_callback.py

- url: /ok_callback
  script: ok_callback.py

- url: /.*
  script: dw_buy.py
  #static_files: static/about.html
  #upload: static/about.html
